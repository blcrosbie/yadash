name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/yadash.mjs validate examples --strict
      - run: node bin/yadash.mjs validate skills/yadash/examples --strict
      - run: npm run build:examples

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The skill must install cleanly and be self-contained: every example it
      # ships has to validate from the installed copy, with no repo alongside.
      - run: node bin/yadash.mjs skill install --to /tmp/skill-check
      - run: test -f /tmp/skill-check/SKILL.md
      - run: node bin/yadash.mjs validate /tmp/skill-check/examples --strict
