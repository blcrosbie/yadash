# A complete, self-contained dashboard: inline data, no files to fetch.
# Copy it, swap the data source for your CSV, rename the metrics.
#   yadash validate starter.yaml --strict
#   yadash build starter.yaml -o dist/starter
# yaml-language-server: $schema=https://yadash.dev/schema/v0.1/dashboard.schema.json
version: 1

dashboard:
  id: starter
  title: Weekly Sales Health
  description: Booked vs held meetings and pipeline, by rep.
  theme: auto

  data:
    activity:
      type: inline
      date_fields: [day]
      rows:
        - { day: 2026-03-02, rep: Ada,  source: inbound,  booked: 6, held: 5, pipeline: 24000 }
        - { day: 2026-03-02, rep: Lin,  source: outbound, booked: 9, held: 4, pipeline: 31000 }
        - { day: 2026-03-09, rep: Ada,  source: referral, booked: 4, held: 4, pipeline: 18000 }
        - { day: 2026-03-09, rep: Lin,  source: outbound, booked: 8, held: 3, pipeline: 12000 }
        - { day: 2026-03-16, rep: Ada,  source: inbound,  booked: 7, held: 6, pipeline: 41000 }
        - { day: 2026-03-16, rep: Lin,  source: inbound,  booked: 5, held: 5, pipeline: 27000 }
        - { day: 2026-03-23, rep: Ada,  source: outbound, booked: 3, held: 1, pipeline: 9000 }
        - { day: 2026-03-23, rep: Lin,  source: referral, booked: 6, held: 5, pipeline: 33000 }

  metrics:
    booked:
      agg: sum
      field: booked
      label: Meetings booked
    held:
      agg: sum
      field: held
      label: Meetings held
    show_rate:
      agg: ratio          # recomputed under every filter - never a pre-divided column
      field: held
      of: booked
      label: Show rate
      format: percent
    pipeline:
      agg: sum
      field: pipeline
      label: Pipeline
      format: currency

  filters:
    - field: day
      type: date_range
      label: Date
    - field: rep
      label: Rep
    - field: source
      type: multiselect
      label: Source

  layout:
    columns: 12

  widgets:
    - id: kpi_booked
      type: kpi
      title: Booked
      metric: booked
      compare: previous_period
      position: [1, 1]
      size: [3, 2]

    - id: kpi_show_rate
      type: kpi
      title: Show rate
      metric: show_rate
      target: 0.8
      thresholds:
        - below: 0.7
          state: bad
          label: Below target
        - above: 0.8
          state: good
          label: On track
      position: [4, 1]
      size: [3, 2]

    - id: kpi_pipeline
      type: kpi
      title: Pipeline
      metric: pipeline
      compare: previous_period
      position: [7, 1]
      size: [3, 2]

    - id: trend
      type: line
      title: Meetings held per week
      x: { field: day, bucket: week }
      y: { metric: held, label: Held }
      smooth: true
      position: [1, 3]
      size: [8, 5]

    - id: source_mix
      type: donut
      title: Pipeline by source
      dimension: { field: source }
      metric: pipeline
      position: [9, 3]
      size: [4, 5]

    - id: rep_table
      type: table
      title: Rep performance
      dimensions:
        - field: rep
          label: Rep
      metrics: [booked, held, show_rate, pipeline]
      columns:
        - key: rep
          label: Rep
        - key: booked
          label: Booked
          bar: true
        - key: held
          label: Held
        - key: show_rate
          label: Show rate
          thresholds:
            - below: 0.7
              state: bad
            - above: 0.8
              state: good
        - key: pipeline
          label: Pipeline
      sort: { by: pipeline, direction: desc }
      position: [1, 8]
      size: [12, 5]
